name: Bug report
description: Something in fire doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal fire.yml
      description: The smallest config that reproduces it.
      render: yaml
  - type: input
    id: version
    attributes:
      label: fire version and OS
      placeholder: "v2.10.0, macOS 15 arm64"
    validations:
      required: true
