name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload, e.g. v2.10.0"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.archive_suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_suffix: macos-arm64
          - runner: macos-15
            target: x86_64-apple-darwin
            archive_suffix: macos-intel
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive_suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Sync Cargo.toml version from tag
        env:
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          case "${TAG_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid tag format: ${TAG_NAME}. Expected vX.Y.Z"
              exit 1
              ;;
          esac
          VERSION="${TAG_NAME#v}"
          perl -0777 -i -pe 's/^version\s*=\s*"[0-9A-Za-z\.\-\+]+"/version = "'"${VERSION}"'"/m' Cargo.toml
          awk -v v="${VERSION}" '
            BEGIN { in_pkg = 0; fire_pkg = 0; updated = 0 }
            /^\[\[package\]\]$/ { in_pkg = 1; fire_pkg = 0 }
            in_pkg && /^name = "fire-cli"$/ { fire_pkg = 1; print; next }
            in_pkg && fire_pkg && /^version = "/ {
              print "version = \"" v "\""
              in_pkg = 0
              fire_pkg = 0
              updated = 1
              next
            }
            { print }
            END {
              if (updated == 0) {
                print "fire-cli package block not found in Cargo.lock" > "/dev/stderr"
                exit 1
              }
            }
          ' Cargo.lock > Cargo.lock.tmp
          mv Cargo.lock.tmp Cargo.lock
          grep -n '^version = ' Cargo.toml
          awk 'found && /^version = / {print; exit} /^\[\[package\]\]$/ {found=0} /^name = "fire-cli"$/ {found=1}' Cargo.lock

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package archive
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
        run: |
          ARCHIVE="fire-${VERSION}-${ARCHIVE_SUFFIX}.tar.gz"
          BIN_PATH="target/${TARGET}/release/fire"

          test -f "${BIN_PATH}"
          tar -czf "${ARCHIVE}" -C "target/${TARGET}/release" fire
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.archive_suffix }}
          path: |
            fire-${{ env.RELEASE_TAG }}-${{ matrix.archive_suffix }}.tar.gz
            fire-${{ env.RELEASE_TAG }}-${{ matrix.archive_suffix }}.tar.gz.sha256

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Build checksums file
        run: |
          cat dist/*.sha256 | sort -k2 > dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Fire ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-22.04
    needs: build
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.toml version from tag
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG_NAME#v}"
          perl -0777 -i -pe 's/^version\s*=\s*"[0-9A-Za-z\.\-\+]+"/version = "'"${VERSION}"'"/m' Cargo.toml

      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --allow-dirty

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-22.04
    needs: release
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Checkout
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v4

      - name: Checkout tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: gbenm/homebrew-labs
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release download "${RELEASE_TAG}" -R "${{ github.repository }}" -p checksums.txt -O checksums.txt
          .github/scripts/homebrew-formula.sh "${VERSION}" checksums.txt > tap/Formula/fire.rb
          cd tap
          if git diff --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bump fire to ${RELEASE_TAG}"
          git push

  mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-22.04
    # The registry verifies ownership through the README published on crates.io.
    needs: crates-io
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Set version in server.json
        run: |
          VERSION="${RELEASE_TAG#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          # crates.io may take a moment to serve the new README the registry checks.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish failed (attempt $attempt), retrying in 30s"
            sleep 30
          done
          exit 1
