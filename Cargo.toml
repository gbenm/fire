[package]
name = "fire-cli"
version = "3.0.1"
edition = "2021"
description = "Config-first task runner: YAML commands, dynamic completion, detachable pty sessions, and an MCP server for AI agents"
license = "MIT"
documentation = "https://github.com/gbenm/fire/tree/main/docs"
readme = "README.md"
keywords = ["task-runner", "cli", "yaml", "mcp", "make"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "src/**",
  "docs/*.md",
  "schemas/fire.schema.json",
  "build.rs",
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  "README.md",
]
homepage = "https://github.com/gbenm/fire"
repository = "https://github.com/gbenm/fire"

[[bin]]
name = "fire"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "7.0.0"
libc = "0.2.191"
yaml_serde = "0.10.7"
serde = { version = "1.0.229", features = ["derive"] }
rmcp = { version = "3.11.0", features = ["macros", "server", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml_edit = "0.25.20"

[build-dependencies]
serde_json = "1.0.154"

[dev-dependencies]
jsonschema = { version = "0.63.0", default-features = false }
